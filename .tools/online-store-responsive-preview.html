<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Online Store responsive QA wrapper</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:28px;display:grid;place-items:start center;background:#dfe5df;font-family:Arial,sans-serif}.label{position:fixed;right:16px;top:16px;z-index:2;padding:8px 10px;border-radius:999px;background:#173f33;color:#fff;font-size:11px;font-weight:700}iframe{display:block;border:1px solid #9baaa2;background:#fff;box-shadow:0 18px 50px rgba(20,50,40,.2)}
  </style>
</head>
<body>
  <div class="label" id="label"></div>
  <iframe id="preview" title="Responsive Online Store homepage preview" src="../online-store-homepage-mockup-v1.3.html"></iframe>
  <script>
    const params=new URLSearchParams(location.search),width=Math.max(320,Number(params.get('width'))||995),height=Math.max(600,Number(params.get('height'))||1100),frame=document.querySelector('#preview');frame.style.width=width+'px';frame.style.height=height+'px';document.querySelector('#label').textContent=width+' × '+height;
  </script>
</body>
</html>
