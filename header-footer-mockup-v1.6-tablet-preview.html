<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Tablet Preview | Header + Footer Mockup v1.6</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px;background:#e9ece9;color:#174c3c;font-family:Arial,sans-serif}
    .preview-heading{margin:0 auto 14px;max-width:928px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
    .size{color:#65746d;font-size:11px;font-weight:600;letter-spacing:.06em}
    .tablet{width:928px;height:720px;margin:0 auto;overflow:hidden;border:10px solid #26342e;border-radius:24px;background:#fff;box-shadow:0 22px 60px rgba(22,52,40,.25)}
    iframe{width:100%;height:100%;display:block;border:0;background:#fff}
    .help{max-width:928px;margin:14px auto 0;color:#52655c;font-size:13px;line-height:1.45;text-align:center}
    @media(max-width:980px){body{padding:12px 6px}.tablet{width:min(928px,100%);border-width:7px;border-radius:18px}.preview-heading,.help{padding:0 7px}}
  </style>
</head>
<body>
  <div class="preview-heading"><span>Header + Footer v1.6</span><span class="size">Tablet · 928px</span></div>
  <div class="tablet"><iframe src="header-footer-mockup-v1.6.html" title="Interactive tablet preview of header and footer version 1.6"></iframe></div>
  <p class="help">Scroll inside the tablet. Open Menu at the top or use the + controls in the footer.</p>
</body>
</html>
